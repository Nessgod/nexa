<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plan Bola de Nieve</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snowball">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #1E1E24; 
            color: #f8f9fa; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        .card { 
            background-color: #2b2b36; 
            border: none; 
            border-radius: 12px; 
            margin-bottom: 15px;
        }
        .card-header {
            background-color: #1a1a20;
            border-bottom: 1px solid #444;
            border-top-left-radius: 12px !important;
            border-top-right-radius: 12px !important;
            font-weight: bold;
        }
        .text-accent { color: #0d6efd; }
        .text-success-custom { color: #20c997; }
        .btn-custom { font-weight: bold; padding: 12px; border-radius: 8px; }
        .debt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #444;
        }
        .debt-item:last-child { border-bottom: none; }
        .debt-name { font-size: 1.1rem; font-weight: 500; }
        .debt-balance { font-size: 1.2rem; font-weight: bold; }
        .paid-badge { text-decoration: line-through; opacity: 0.5; }
    </style>
</head>
<body class="container py-4">

    <div class="text-center mb-4">
        <h2 class="fw-bold">Plan Bola de Nieve</h2>
        <p class="text-muted" id="mesActualBadge">Mes Actual: 1</p>
    </div>

    <!-- Estado Financiero -->
    <div class="card shadow-lg mb-4">
        <div class="card-header d-flex justify-content-between">
            <span>Flujo de Caja (Pozo)</span>
            <span id="pozoActual" class="text-success-custom fs-5">$0</span>
        </div>
        <div class="card-body">
            <p class="mb-1 small text-muted">Estado del ciclo:</p>
            <h5 id="estadoCiclo" class="text-accent mb-0">Esperando Lote 1</h5>
        </div>
    </div>

    <!-- Acciones -->
    <div class="row g-3 mb-4">
        <div class="col-6">
            <button id="btnLote1" class="btn btn-primary w-100 btn-custom" onclick="ejecutarLote1()">Ejecutar Lote 1<br><small>(Día 5)</small></button>
        </div>
        <div class="col-6">
            <button id="btnLote2" class="btn btn-success w-100 btn-custom" onclick="ejecutarLote2()" disabled>Ejecutar Lote 2<br><small>(Ataque)</small></button>
        </div>
    </div>

    <!-- Lista de Deudas -->
    <h5 class="fw-bold mb-3">Estado de Tarjetas</h5>
    <div class="card shadow-lg p-3" id="listaDeudas">
        <!-- Renderizado por JS -->
    </div>

    <div class="text-center mt-4">
        <button class="btn btn-sm btn-outline-danger" onclick="reiniciarPlan()">Reiniciar Todo el Plan</button>
    </div>

    <script>
        // CONFIGURACIÓN INICIAL HARDCODED
        const DEUDAS_INICIALES = [
            { id: 'tricot', nombre: 'Tricot', saldo: 164886, minimo: 30000 },
            { id: 'santander', nombre: 'Santander', saldo: 506857, minimo: 40000 },
            { id: 'itau', nombre: 'Itaú', saldo: 613152, minimo: 55000 },
            { id: 'lider', nombre: 'Lider', saldo: 960000, minimo: 113000 },
            { id: 'falabella', nombre: 'Falabella', saldo: 1141200, minimo: 162000 },
            { id: 'cencosud', nombre: 'Cencosud', saldo: 1195320, minimo: 85000 }
        ];

        const INGRESO_DIA_5 = 920000;
        const GASTO_FIJO_CASA = 584000;
        const INGRESO_DIA_15 = 250000;

        // ESTADO GLOBAL
        let state = {
            mes: 1,
            fase: 0, // 0 = Esperando Lote 1, 1 = Esperando Lote 2
            pozo: 0,
            deudas: JSON.parse(JSON.stringify(DEUDAS_INICIALES))
        };

        // INICIALIZACIÓN
        function init() {
            const savedState = localStorage.getItem('snowballState');
            if (savedState) {
                state = JSON.parse(savedState);
            }
            render();
        }

        function saveState() {
            localStorage.setItem('snowballState', JSON.stringify(state));
            render();
        }

        // LÓGICA DE NEGOCIO
        function ejecutarLote1() {
            if (state.fase !== 0) return;

            let disponible = INGRESO_DIA_5 - GASTO_FIJO_CASA; // 336.000
            
            // Pagos mínimos de Falabella, Cencosud e Itaú
            const aPagar = ['falabella', 'cencosud', 'itau'];
            aPagar.forEach(id => {
                let deuda = state.deudas.find(d => d.id === id);
                if (deuda && deuda.saldo > 0) {
                    let pago = Math.min(deuda.saldo, deuda.minimo);
                    disponible -= pago;
                    deuda.saldo -= pago;
                }
            });

            // Guardar remanente en pozo y avanzar fase
            state.pozo = disponible;
            state.fase = 1;
            saveState();
        }

        function ejecutarLote2() {
            if (state.fase !== 1) return;

            // Ingreso quincena + pozo anterior
            let disponible = INGRESO_DIA_15 + state.pozo;

            // Pagos mínimos de Lider, Santander (y Tricot, si asumimos que se paga aquí el mínimo para que no quede impago antes del ataque)
            // NOTA: El prompt no especificó el mínimo de Tricot en los lotes, pero tiene $30.000 asignados. 
            // Pagaremos Lider y Santander como se indicó explícitamente.
            const aPagar = ['lider', 'santander'];
            aPagar.forEach(id => {
                let deuda = state.deudas.find(d => d.id === id);
                if (deuda && deuda.saldo > 0) {
                    let pago = Math.min(deuda.saldo, deuda.minimo);
                    disponible -= pago;
                    deuda.saldo -= pago;
                }
            });

            // Si Tricot tiene saldo, descontar su mínimo por sanidad financiera antes del ataque
            let tricot = state.deudas.find(d => d.id === 'tricot');
            if (tricot && tricot.saldo > 0) {
                let pago = Math.min(tricot.saldo, tricot.minimo);
                disponible -= pago;
                tricot.saldo -= pago;
            }

            // ATAQUE BOLA DE NIEVE (Pagar deuda activa con menor saldo)
            let deudasActivas = state.deudas.filter(d => d.saldo > 0);
            deudasActivas.sort((a, b) => a.saldo - b.saldo);

            if (deudasActivas.length > 0 && disponible > 0) {
                let deudaObjetivo = deudasActivas[0];
                let abonoExtra = Math.min(deudaObjetivo.saldo, disponible);
                deudaObjetivo.saldo -= abonoExtra;
                disponible -= abonoExtra; // El sobrante real podría guardarse o perderse, lo dejamos en 0 para simplificar.
            }

            // Reiniciar para el próximo mes
            state.pozo = 0;
            state.fase = 0;
            state.mes += 1;
            saveState();
        }

        function reiniciarPlan() {
            if (confirm("¿Estás seguro de reiniciar todo el progreso a los saldos iniciales?")) {
                localStorage.removeItem('snowballState');
                state = {
                    mes: 1,
                    fase: 0,
                    pozo: 0,
                    deudas: JSON.parse(JSON.stringify(DEUDAS_INICIALES))
                };
                saveState();
            }
        }

        // RENDERIZADO UI
        function formatMoney(amount) {
            return '$' + amount.toLocaleString('es-CL');
        }

        function render() {
            document.getElementById('mesActualBadge').textContent = `Mes Actual: ${state.mes}`;
            document.getElementById('pozoActual').textContent = formatMoney(state.pozo);
            
            const btnLote1 = document.getElementById('btnLote1');
            const btnLote2 = document.getElementById('btnLote2');
            const estadoCiclo = document.getElementById('estadoCiclo');

            if (state.fase === 0) {
                btnLote1.disabled = false;
                btnLote2.disabled = true;
                estadoCiclo.textContent = "Esperando Lote 1 (Día 5)";
                estadoCiclo.className = "text-accent mb-0";
            } else {
                btnLote1.disabled = true;
                btnLote2.disabled = false;
                estadoCiclo.textContent = "Esperando Lote 2 (Ataque)";
                estadoCiclo.className = "text-warning mb-0";
            }

            // Render Deudas ordenadas por saldo para visualizar la bola de nieve
            const lista = document.getElementById('listaDeudas');
            lista.innerHTML = '';
            
            // Hacemos una copia para ordenar visualmente sin alterar el array original
            let deudasVisual = [...state.deudas].sort((a, b) => a.saldo - b.saldo);
            let todasPagadas = true;

            deudasVisual.forEach(d => {
                if (d.saldo > 0) todasPagadas = false;
                
                const row = document.createElement('div');
                row.className = `debt-item ${d.saldo === 0 ? 'paid-badge' : ''}`;
                row.innerHTML = `
                    <div>
                        <div class="debt-name">${d.nombre}</div>
                        <small class="text-muted">Mín: ${formatMoney(d.minimo)}</small>
                    </div>
                    <div class="text-end">
                        <div class="debt-balance text-${d.saldo === 0 ? 'success' : 'danger'}">${formatMoney(d.saldo)}</div>
                    </div>
                `;
                lista.appendChild(row);
            });

            if (todasPagadas) {
                estadoCiclo.textContent = "¡LIBRE DE DEUDAS!";
                estadoCiclo.className = "text-success mb-0 fw-bold";
                btnLote1.disabled = true;
                btnLote2.disabled = true;
            }
        }

        // Arrancar
        init();
    </script>
</body>
</html>
