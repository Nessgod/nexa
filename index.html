<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexa</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexa">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- UI Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Estilos Core -->
    <style>
        body { background-color: #1E1E24; color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #2b2b36; border: none; border-radius: 12px; }
        .form-control, .form-select { background-color: #1a1a20; color: white; border: 1px solid #444; }
        .form-control:focus, .form-select:focus { background-color: #1a1a20; color: white; border-color: #0d6efd; box-shadow: none; }
        .list-group-item { border-color: #444; }
        .nav-link { color: #aaa; cursor: pointer; }
        .nav-link.active { color: #fff; font-weight: bold; border-bottom: 2px solid #0d6efd; }
        .d-none { display: none !important; }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
    </style>
</head>
<body class="container py-4">

    <div id="auth-section">
        <h2 class="text-center mb-4 fw-bold">Bienvenido a Nexa</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-lg">
                    <ul class="nav nav-tabs mb-3" id="authTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab">Iniciar Sesión</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registrarse</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="authTabContent">
                        <!-- Login -->
                        <div class="tab-pane fade show active" id="login" role="tabpanel">
                            <form id="formLogin">
                                <input type="email" id="loginEmail" class="form-control mb-3" placeholder="Correo" required>
                                <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña" required>
                                <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
                            </form>
                        </div>
                        <!-- Register -->
                        <div class="tab-pane fade" id="register" role="tabpanel">
                            <form id="formRegister">
                                <input type="email" id="regEmail" class="form-control mb-3" placeholder="Correo" required>
                                <input type="password" id="regPass" class="form-control mb-3" placeholder="Contraseña" required>
                                <button type="submit" class="btn btn-success w-100 fw-bold">Crear Cuenta</button>
                            </form>
                        </div>
                    </div>
                    <div id="authError" class="text-danger mt-3 text-center d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-section" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold m-0">Nexa</h3>
            <div>
                <span id="userEmailDisplay" class="me-3 text-muted small"></span>
                <button id="btnLogout" class="btn btn-sm btn-outline-danger">Salir</button>
            </div>
        </div>

        <!-- Grupo Management -->
        <div id="group-setup" class="alert alert-dark border border-secondary mb-4">
            <strong>Panel Compartido:</strong> 
            <span id="groupStatus">No estás en ningún grupo compartido.</span>
            <div class="mt-2" id="groupActions">
                <button class="btn btn-sm btn-primary me-2" id="btnCreateGroup">Crear Nuevo Grupo</button>
                <div class="input-group input-group-sm mt-2" style="max-width: 300px;">
                    <input type="text" id="joinGroupId" class="form-control" placeholder="ID del Grupo">
                    <button class="btn btn-outline-success" id="btnJoinGroup">Unirse</button>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav mb-4" id="appTabs">
            <li class="nav-item"><a class="nav-link active" data-target="panel-personal">Personal</a></li>
            <li class="nav-item"><a class="nav-link" data-target="panel-compartido">Compartido</a></li>
            <li class="nav-item"><a class="nav-link" data-target="panel-graficos">Gráficos</a></li>
        </ul>

        <!-- Panel Personal / Compartido (Shared logic UI) -->
        <div id="panels-container">
            <div class="row g-4">
                <!-- Bloque Gastos -->
                <div class="col-md-6">
                    <div class="card p-3 shadow-lg">
                        <h5 class="fw-bold mb-3" id="gastosTitle">Registrar Gasto</h5>
                        <form id="formGasto" class="mb-4">
                            <input type="text" id="descGasto" class="form-control mb-2" placeholder="Detalle (Ej. Supermercado)" required>
                            <input type="number" id="montoGasto" class="form-control mb-2" placeholder="Monto ($)" required>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Gasto</button>
                        </form>
                        <h6 class="fw-bold text-muted d-flex justify-content-between">
                            <span>Registro Histórico</span>
                            <span id="totalGastos" class="text-white">$0</span>
                        </h6>
                        <ul id="listaGastos" class="list-group list-group-flush bg-transparent"></ul>
                    </div>
                </div>

                <!-- Bloque Tareas -->
                <div class="col-md-6">
                    <div class="card p-3 shadow-lg">
                        <h5 class="fw-bold mb-3" id="tareasTitle">Lista de Tareas</h5>
                        <form id="formTarea" class="mb-4 d-flex">
                            <input type="text" id="descTarea" class="form-control me-2" placeholder="Ingresar nueva tarea..." required>
                            <button type="submit" class="btn btn-success fw-bold">+</button>
                        </form>
                        <ul id="listaTareas" class="list-group list-group-flush bg-transparent"></ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Gráficos -->
        <div id="panel-graficos" class="d-none">
            <div class="card p-3 shadow-lg">
                <h5 class="fw-bold mb-3">Análisis de Gastos</h5>
                <canvas id="gastosChart" style="max-height: 400px;"></canvas>
            </div>
        </div>

    </div>

    <!-- Scripts Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Core App Logic -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
