<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plan Bola de Nieve</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snowball">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #13131A;
            --bg-card: #1C1C24;
            --text-main: #FFFFFF;
            --text-muted: #8E8E9F;
            --accent-blue: #3B82F6;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --border-color: #2D2D3A;
        }
        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            min-height: 100vh;
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 2rem;
        }
        .card { 
            background-color: var(--bg-card); 
            border: 1px solid var(--border-color); 
            border-radius: 16px; 
            margin-bottom: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .card-header {
            background-color: rgba(255,255,255,0.02);
            border-bottom: 1px solid var(--border-color);
            border-top-left-radius: 16px !important;
            border-top-right-radius: 16px !important;
            font-weight: 600;
            padding: 1rem 1.25rem;
        }
        .card-body { padding: 1.25rem; }
        .text-accent { color: var(--accent-blue) !important; }
        .text-warning-custom { color: #F59E0B !important; }
        .text-success-custom { color: var(--accent-green) !important; }
        .text-danger-custom { color: var(--accent-red) !important; }
        .text-muted-custom { color: var(--text-muted) !important; }
        
        .btn-custom { 
            font-weight: 600; 
            padding: 14px; 
            border-radius: 12px; 
            border: none;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-custom:active { transform: scale(0.97); }
        .btn-custom:disabled { opacity: 0.5; transform: none; }
        .btn-primary-custom { background-color: var(--accent-blue); color: white; }
        .btn-success-custom { background-color: var(--accent-green); color: white; }
        
        .debt-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }
        .debt-item:last-child { border-bottom: none; }
        .debt-name { font-size: 1.1rem; font-weight: 600; color: var(--text-main); }
        .debt-min { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .debt-balance { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.5px; }
        .paid-badge { opacity: 0.4; }
        .paid-badge .debt-name { text-decoration: line-through; }
        
        .top-header {
            padding: 2rem 0 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="container app-container">
        <div class="text-center top-header">
            <h2 class="fw-bold mb-1">Bola de Nieve</h2>
            <div class="badge bg-secondary bg-opacity-25 text-light px-3 py-2 rounded-pill mt-2" id="mesActualBadge" style="font-size: 0.9rem;">Mes Actual: 1</div>
        </div>

        <!-- Estado Financiero -->
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Flujo de Caja (Pozo)</span>
                <span id="pozoActual" class="text-success-custom fs-4 fw-bold">$0</span>
            </div>
            <div class="card-body text-center py-4">
                <p class="mb-2 small text-muted-custom text-uppercase fw-bold tracking-wide">Estado del ciclo</p>
                <h4 id="estadoCiclo" class="text-accent fw-bold mb-0">Esperando Lote 1</h4>
            </div>
        </div>

        <!-- Acciones -->
        <div class="row g-3 mb-4">
            <div class="col-6">
                <button id="btnLote1" class="btn btn-primary-custom w-100 btn-custom shadow-sm" onclick="ejecutarLote1()">
                    Lote 1 <br><small class="fw-normal opacity-75">(Día 5)</small>
                </button>
            </div>
            <div class="col-6">
                <button id="btnLote2" class="btn btn-success-custom w-100 btn-custom shadow-sm" onclick="ejecutarLote2()" disabled>
                    Lote 2 <br><small class="fw-normal opacity-75">(Ataque)</small>
                </button>
            </div>
        </div>

        <!-- Lista de Deudas -->
        <div class="d-flex justify-content-between align-items-end mb-3 px-1">
            <h5 class="fw-bold mb-0">Estado de Tarjetas</h5>
        </div>
        <div class="card" id="listaDeudas">
            <!-- Renderizado por JS -->
        </div>

        <div class="text-center mt-5">
            <button class="btn btn-sm btn-outline-danger px-4 rounded-pill" onclick="reiniciarPlan()">Reiniciar Progreso</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN INICIAL HARDCODED
        const DEUDAS_INICIALES = [
            { id: 'tricot', nombre: 'Tricot', saldo: 164886, minimo: 30000 },
            { id: 'santander', nombre: 'Santander', saldo: 506857, minimo: 40000 },
            { id: 'itau', nombre: 'Itaú', saldo: 613152, minimo: 55000 },
            { id: 'lider', nombre: 'Lider', saldo: 960000, minimo: 113000 },
            { id: 'falabella', nombre: 'Falabella', saldo: 1141200, minimo: 162000 },
            { id: 'cencosud', nombre: 'Cencosud', saldo: 1195320, minimo: 85000 }
        ];

        const INGRESO_DIA_5 = 920000;
        const GASTO_FIJO_CASA = 584000;
        const INGRESO_DIA_15 = 250000;

        // ESTADO GLOBAL
        let state = {
            mes: 1,
            fase: 0, // 0 = Esperando Lote 1, 1 = Esperando Lote 2
            pozo: 0,
            deudas: JSON.parse(JSON.stringify(DEUDAS_INICIALES))
        };

        // INICIALIZACIÓN
        function init() {
            const savedState = localStorage.getItem('snowballState');
            if (savedState) {
                state = JSON.parse(savedState);
            }
            render();
        }

        function saveState() {
            localStorage.setItem('snowballState', JSON.stringify(state));
            render();
        }

        // LÓGICA DE NEGOCIO
        function ejecutarLote1() {
            if (state.fase !== 0) return;

            let disponible = INGRESO_DIA_5 - GASTO_FIJO_CASA; // 336.000
            
            // Pagos mínimos de Falabella, Cencosud e Itaú
            const aPagar = ['falabella', 'cencosud', 'itau'];
            aPagar.forEach(id => {
                let deuda = state.deudas.find(d => d.id === id);
                if (deuda && deuda.saldo > 0) {
                    let pago = Math.min(deuda.saldo, deuda.minimo);
                    disponible -= pago;
                    deuda.saldo -= pago;
                }
            });

            // Guardar remanente en pozo y avanzar fase
            state.pozo = disponible;
            state.fase = 1;
            saveState();
        }

        function ejecutarLote2() {
            if (state.fase !== 1) return;

            // Ingreso quincena + pozo anterior
            let disponible = INGRESO_DIA_15 + state.pozo;

            // Pagos mínimos de Lider, Santander (y Tricot, si asumimos que se paga aquí el mínimo para que no quede impago antes del ataque)
            // NOTA: El prompt no especificó el mínimo de Tricot en los lotes, pero tiene $30.000 asignados. 
            // Pagaremos Lider y Santander como se indicó explícitamente.
            const aPagar = ['lider', 'santander'];
            aPagar.forEach(id => {
                let deuda = state.deudas.find(d => d.id === id);
                if (deuda && deuda.saldo > 0) {
                    let pago = Math.min(deuda.saldo, deuda.minimo);
                    disponible -= pago;
                    deuda.saldo -= pago;
                }
            });

            // Si Tricot tiene saldo, descontar su mínimo por sanidad financiera antes del ataque
            let tricot = state.deudas.find(d => d.id === 'tricot');
            if (tricot && tricot.saldo > 0) {
                let pago = Math.min(tricot.saldo, tricot.minimo);
                disponible -= pago;
                tricot.saldo -= pago;
            }

            // ATAQUE BOLA DE NIEVE (Pagar deuda activa con menor saldo)
            let deudasActivas = state.deudas.filter(d => d.saldo > 0);
            deudasActivas.sort((a, b) => a.saldo - b.saldo);

            if (deudasActivas.length > 0 && disponible > 0) {
                let deudaObjetivo = deudasActivas[0];
                let abonoExtra = Math.min(deudaObjetivo.saldo, disponible);
                deudaObjetivo.saldo -= abonoExtra;
                disponible -= abonoExtra; // El sobrante real podría guardarse o perderse, lo dejamos en 0 para simplificar.
            }

            // Reiniciar para el próximo mes
            state.pozo = 0;
            state.fase = 0;
            state.mes += 1;
            saveState();
        }

        function reiniciarPlan() {
            if (confirm("¿Estás seguro de reiniciar todo el progreso a los saldos iniciales?")) {
                localStorage.removeItem('snowballState');
                state = {
                    mes: 1,
                    fase: 0,
                    pozo: 0,
                    deudas: JSON.parse(JSON.stringify(DEUDAS_INICIALES))
                };
                saveState();
            }
        }

        // RENDERIZADO UI
        function formatMoney(amount) {
            return '$' + amount.toLocaleString('es-CL');
        }

        function render() {
            document.getElementById('mesActualBadge').textContent = `Mes Actual: ${state.mes}`;
            document.getElementById('pozoActual').textContent = formatMoney(state.pozo);
            
            const btnLote1 = document.getElementById('btnLote1');
            const btnLote2 = document.getElementById('btnLote2');
            const estadoCiclo = document.getElementById('estadoCiclo');

            if (state.fase === 0) {
                btnLote1.disabled = false;
                btnLote2.disabled = true;
                estadoCiclo.textContent = "Esperando Lote 1 (Día 5)";
                estadoCiclo.className = "text-accent mb-0";
            } else {
                btnLote1.disabled = true;
                btnLote2.disabled = false;
                estadoCiclo.textContent = "Esperando Lote 2 (Ataque)";
                estadoCiclo.className = "text-warning mb-0";
            }

            // Render Deudas ordenadas por saldo para visualizar la bola de nieve
            const lista = document.getElementById('listaDeudas');
            lista.innerHTML = '';
            
            // Hacemos una copia para ordenar visualmente sin alterar el array original
            let deudasVisual = [...state.deudas].sort((a, b) => a.saldo - b.saldo);
            let todasPagadas = true;

            deudasVisual.forEach(d => {
                if (d.saldo > 0) todasPagadas = false;
                
                const row = document.createElement('div');
                row.className = `debt-item ${d.saldo === 0 ? 'paid-badge' : ''}`;
                row.innerHTML = `
                    <div>
                        <div class="debt-name">${d.nombre}</div>
                        <div class="debt-min">Mín: ${formatMoney(d.minimo)}</div>
                    </div>
                    <div class="text-end">
                        <div class="debt-balance text-${d.saldo === 0 ? 'success-custom' : 'danger-custom'}">${formatMoney(d.saldo)}</div>
                    </div>
                `;
                lista.appendChild(row);
            });

            if (todasPagadas) {
                estadoCiclo.textContent = "¡LIBRE DE DEUDAS!";
                estadoCiclo.className = "text-success mb-0 fw-bold";
                btnLote1.disabled = true;
                btnLote2.disabled = true;
            }
        }

        // Arrancar
        init();
    </script>
</body>
</html>
