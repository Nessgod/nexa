<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexa</title>
    
    <!-- PWA iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexa">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- UI Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos Core -->
    <style>
        body { background-color: #1E1E24; color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
        .card { background-color: #2b2b36; border: none; border-radius: 12px; }
        .form-control, .form-select { 
            background-color: #1a1a20; 
            color: white; 
            border: 1px solid #444; 
        }
        .form-control:focus, .form-select:focus { 
            background-color: #1a1a20; 
            color: white; 
            border-color: #0d6efd; 
            box-shadow: none; 
        }
        .list-group-item { border-color: #444; }
    </style>
</head>
<body class="container py-4">

    <h3 class="text-center mb-4 fw-bold">Nexa - Control Compartido</h3>

    <div class="row g-4">
        <!-- Bloque Transaccional (Gastos) -->
        <div class="col-md-6">
            <div class="card p-3 shadow-lg">
                <h5 class="fw-bold mb-3">Registrar Gasto</h5>
                <form id="formGasto" class="mb-4">
                    <input type="text" id="descGasto" class="form-control mb-2" placeholder="Detalle (Ej. Supermercado)" required>
                    <input type="number" id="montoGasto" class="form-control mb-2" placeholder="Monto ($)" required>
                    <select id="userGasto" class="form-select mb-3">
                        <option value="Bryan">Bryan</option>
                        <option value="Pareja">Pareja</option>
                    </select>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Transacción</button>
                </form>
                <h6 class="fw-bold text-muted">Registro Histórico</h6>
                <ul id="listaGastos" class="list-group list-group-flush bg-transparent"></ul>
            </div>
        </div>

        <!-- Bloque Operativo (Tareas) -->
        <div class="col-md-6">
            <div class="card p-3 shadow-lg">
                <h5 class="fw-bold mb-3">Lista de Tareas</h5>
                <form id="formTarea" class="mb-4 d-flex">
                    <input type="text" id="descTarea" class="form-control me-2" placeholder="Ingresar nueva tarea..." required>
                    <button type="submit" class="btn btn-success fw-bold">+</button>
                </form>
                <ul id="listaTareas" class="list-group list-group-flush bg-transparent"></ul>
            </div>
        </div>
    </div>

    <!-- Core Lógico: Supabase Client -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.33.1/+esm'

        // Reemplazar con credenciales de tu proyecto Supabase
        const supabaseUrl = 'TU_URL_DE_SUPABASE';
        const supabaseKey = 'TU_LLAVE_ANONIMA_DE_SUPABASE';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // Módulo de Renderizado y Consulta de Gastos
        async function cargarGastos() {
            const { data, error } = await supabase.from('Gastos').select('*').order('FechaCreacion', { ascending: false }).limit(20);
            if (!error && data) {
                document.getElementById('listaGastos').innerHTML = data.map(g => 
                    `<li class="list-group-item bg-transparent text-white d-flex justify-content-between px-0">
                        <span>${g.Descripcion} <small class="text-secondary">(${g.Usuario})</small></span>
                        <strong class="text-danger">$${g.Monto.toLocaleString('es-CL')}</strong>
                    </li>`
                ).join('');
            }
        }

        document.getElementById('formGasto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;
            
            const payload = {
                Descripcion: document.getElementById('descGasto').value,
                Monto: parseFloat(document.getElementById('montoGasto').value),
                Usuario: document.getElementById('userGasto').value
            };
            
            await supabase.from('Gastos').insert([payload]);
            e.target.reset();
            btn.disabled = false;
        });

        // Módulo de Renderizado y Consulta de Tareas
        async function cargarTareas() {
            const { data, error } = await supabase.from('Tareas').select('*').order('Completada', { ascending: true }).order('FechaCreacion', { ascending: false });
            if (!error && data) {
                document.getElementById('listaTareas').innerHTML = data.map(t => 
                    `<li class="list-group-item bg-transparent text-white px-0 d-flex align-items-center">
                        <input class="form-check-input me-3 check-tarea" type="checkbox" data-id="${t.Id}" ${t.Completada ? 'checked' : ''} style="transform: scale(1.3);">
                        <span style="text-decoration: ${t.Completada ? 'line-through' : 'none'}; opacity: ${t.Completada ? '0.5' : '1'}">${t.Descripcion}</span>
                    </li>`
                ).join('');
                bindTaskEvents();
            }
        }

        document.getElementById('formTarea').addEventListener('submit', async (e) => {
            e.preventDefault();
            const desc = document.getElementById('descTarea').value;
            await supabase.from('Tareas').insert([{ Descripcion: desc }]);
            e.target.reset();
        });

        function bindTaskEvents() {
            document.querySelectorAll('.check-tarea').forEach(chk => {
                chk.addEventListener('change', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    await supabase.from('Tareas').update({ Completada: e.target.checked }).eq('Id', id);
                });
            });
        }

        // Suscripción WebSockets para Mutaciones en Tiempo Real
        supabase.channel('public:db_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'Gastos' }, payload => {
                cargarGastos();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'Tareas' }, payload => {
                cargarTareas();
            })
            .subscribe();

        // Inicialización de la App
        cargarGastos();
        cargarTareas();
    </script>
</body>
</html>
